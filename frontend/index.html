<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCTE-35 Master Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .panel { background-color: #1e293b; border: 1px solid #334155; border-radius: 0.5rem; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 p-4 border-b border-slate-800 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-black tracking-wider text-blue-400">SCTE-35 MONITOR</h1>
        <div class="flex items-center space-x-2">
            <span id="conn-status" class="w-3 h-3 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.8)]"></span>
            <span class="text-xs font-bold text-slate-300">WEBSOCKET STATUS</span>
        </div>
    </header>

    <div class="flex-1 p-4 flex flex-col lg:flex-row gap-4 overflow-hidden">
        
        <!-- Kiri: Player & Control -->
        <div class="w-full lg:w-7/12 flex flex-col gap-4">
            
            <div class="panel p-4 flex gap-2">
                <input type="text" id="stream-url" placeholder="Enter URL (rtmp://, srt://, udp://)" class="flex-1 bg-slate-950 border border-slate-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                <button id="btn-play" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-6 py-2 rounded text-sm transition">PLAY</button>
                <button id="btn-stop" class="bg-red-600 hover:bg-red-500 text-white font-bold px-6 py-2 rounded text-sm transition hidden">STOP</button>
            </div>

            <div class="panel flex-1 bg-black relative flex items-center justify-center overflow-hidden min-h-[300px]">
                <span id="player-placeholder" class="text-slate-600 font-bold tracking-widest text-lg">PREVIEW MONITOR</span>
                <video id="video-player" controls autoplay muted class="absolute inset-0 w-full h-full hidden"></video>
            </div>
        </div>

        <!-- Kanan: Info & Logs -->
        <div class="w-full lg:w-5/12 flex flex-col gap-4">
            
            <!-- Metadata Panel -->
            <div class="panel p-4 grid grid-cols-2 gap-4">
                <h2 class="col-span-2 font-bold text-slate-400 border-b border-slate-700 pb-2 text-sm">STREAM METADATA</h2>
                
                <div>
                    <div class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Format</div>
                    <div id="val-format" class="text-lg font-bold text-white">-</div>
                </div>
                <div>
                    <div class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Bandwidth</div>
                    <div id="val-bw" class="text-lg font-bold text-blue-400">-</div>
                </div>
                <div>
                    <div class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Video Codec</div>
                    <div id="val-vcodec" class="text-lg font-bold text-white">-</div>
                </div>
                <div>
                    <div class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Audio Codec</div>
                    <div id="val-acodec" class="text-lg font-bold text-white">-</div>
                </div>
                <div class="col-span-2 bg-slate-900 p-3 rounded flex justify-between items-center border border-slate-800">
                    <span class="text-xs font-bold text-slate-400 uppercase">SCTE-35 Presence</span>
                    <span id="val-scte-status" class="text-xs font-bold px-3 py-1 bg-slate-800 text-slate-500 rounded">WAITING TRIGGER</span>
                </div>
            </div>

            <!-- Log Panel -->
            <div class="panel flex-1 flex flex-col overflow-hidden">
                <div class="bg-slate-800 p-3 flex justify-between items-center border-b border-slate-700">
                    <h2 class="font-bold text-slate-300 text-sm">SCTE-35 EVENT LOGS</h2>
                    <button onclick="document.getElementById('log-body').innerHTML=''" class="text-[10px] bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-white">CLEAR LOGS</button>
                </div>
                <div class="flex-1 overflow-y-auto p-0">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-slate-900 text-slate-400 sticky top-0">
                            <tr>
                                <th class="p-3">Time</th>
                                <th class="p-3">Event ID</th>
                                <th class="p-3">Type</th>
                                <th class="p-3">Duration</th>
                            </tr>
                        </thead>
                        <tbody id="log-body" class="divide-y divide-slate-800/50">
                            <!-- Injected rows -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script>
        const ws = new WebSocket(`ws://${window.location.host}/ws`);
        const video = document.getElementById('video-player');
        let hlsInstance = null;

        ws.onopen = () => document.getElementById('conn-status').classList.replace('bg-red-500', 'bg-green-500');
        ws.onclose = () => document.getElementById('conn-status').classList.replace('bg-green-500', 'bg-red-500');

        document.getElementById('btn-play').onclick = () => {
            ws.send(JSON.stringify({action: "play", url: document.getElementById('stream-url').value}));
            document.getElementById('btn-play').classList.add('hidden');
            document.getElementById('btn-stop').classList.remove('hidden');
        };

        document.getElementById('btn-stop').onclick = () => {
            ws.send(JSON.stringify({action: "stop"}));
            document.getElementById('btn-play').classList.remove('hidden');
            document.getElementById('btn-stop').classList.add('hidden');
            if(hlsInstance) hlsInstance.destroy();
            video.classList.add('hidden');
            document.getElementById('player-placeholder').classList.remove('hidden');
            document.getElementById('val-format').innerText = "-";
            document.getElementById('val-vcodec').innerText = "-";
            document.getElementById('val-acodec').innerText = "-";
            document.getElementById('val-bw').innerText = "-";
        };

        ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            
            if (msg.type === "stream_info") {
                if (msg.data.status === "ok") {
                    document.getElementById('val-format').innerText = msg.data.format;
                    document.getElementById('val-vcodec').innerText = msg.data.video_codec;
                    document.getElementById('val-acodec').innerText = msg.data.audio_codec;
                    document.getElementById('val-bw').innerText = msg.data.bandwidth;
                }
            } 
            else if (msg.type === "player_ready") {
                const hlsUrl = `http://${window.location.hostname}:8888/live/index.m3u8`;
                video.classList.remove('hidden');
                document.getElementById('player-placeholder').classList.add('hidden');

                // Jeda 2 detik agar MediaMTX selesai compile m3u8 file
                setTimeout(() => {
                    if (Hls.isSupported()) {
                        if(hlsInstance) hlsInstance.destroy();
                        hlsInstance = new Hls({ manifestLoadingMaxRetry: 10, manifestLoadingRetryDelay: 1000 });
                        hlsInstance.loadSource(hlsUrl);
                        hlsInstance.attachMedia(video);
                        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(()=>console.log("Autoplay blocked")));
                        hlsInstance.on(Hls.Events.ERROR, function(event, data) {
                            if (data.fatal && data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                                hlsInstance.startLoad();
                            }
                        });
                    }
                }, 2000);
            }
            else if (msg.type === "scte_data") {
                const badge = document.getElementById('val-scte-status');
                badge.innerText = "CUE DETECTED!";
                badge.className = "text-xs font-bold px-3 py-1 bg-green-900 text-green-400 rounded shadow-[0_0_10px_rgba(74,222,128,0.5)]";
                setTimeout(() => {
                    badge.innerText = "STANDBY";
                    badge.className = "text-xs font-bold px-3 py-1 bg-blue-900 text-blue-400 rounded";
                }, 3000);

                const data = msg.data.info || msg.data;
                const type = data.out_of_network_indicator ? "START/OUT" : "END/IN";
                const dur = data.break_duration ? (data.break_duration / 90000).toFixed(1) + "s" : "-";
                
                const row = `<tr class="hover:bg-slate-800 transition">
                    <td class="p-3 text-slate-400">${new Date().toLocaleTimeString()}</td>
                    <td class="p-3 font-mono text-blue-400">${data.splice_event_id || "N/A"}</td>
                    <td class="p-3 font-bold ${data.out_of_network_indicator ? 'text-red-400' : 'text-green-400'}">${type}</td>
                    <td class="p-3 text-slate-300">${dur}</td>
                </tr>`;
                document.getElementById('log-body').insertAdjacentHTML('afterbegin', row);
            }
        };
    </script>
</body>
</html>
