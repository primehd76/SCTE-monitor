<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broadcast SCTE-35 Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Broadcast UI styling */
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .blinking { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-gray-800 p-4 shadow-md flex justify-between items-center border-b border-gray-700">
        <h1 class="text-xl font-bold tracking-wider text-blue-400">SCTE-35 SPLICING MONITOR</h1>
        <div class="flex items-center space-x-2">
            <span id="conn-status" class="w-3 h-3 rounded-full bg-red-500"></span>
            <span class="text-sm font-semibold">ENGINE STATUS</span>
        </div>
    </header>

    <div class="flex-1 flex p-4 space-x-4 overflow-hidden">
        
        <!-- Left Panel: Player & Controls -->
        <div class="w-1/2 flex flex-col space-y-4">
            
            <!-- Controls -->
            <div class="bg-gray-800 p-4 rounded-lg border border-gray-700 shadow">
                <label class="block text-xs text-gray-400 mb-1 font-semibold uppercase">UDP Source URL</label>
                <div class="flex space-x-2">
                    <input type="text" id="udp-url" value="udp://@239.0.0.1:1234" class="flex-1 bg-gray-900 border border-gray-600 rounded px-3 py-2 focus:outline-none focus:border-blue-500 text-sm">
                    <button id="btn-run" class="bg-green-600 hover:bg-green-500 px-6 py-2 rounded font-bold transition">RUN</button>
                    <button id="btn-stop" class="bg-red-600 hover:bg-red-500 px-6 py-2 rounded font-bold transition hidden">STOP</button>
                </div>
            </div>

            <!-- Video Player (WebRTC) -->
            <div class="bg-black flex-1 rounded-lg border-2 border-gray-700 relative overflow-hidden flex items-center justify-center">
                <span id="player-placeholder" class="text-gray-500 font-bold tracking-widest">NO SIGNAL</span>
                <iframe id="webrtc-player" class="w-full h-full absolute inset-0 hidden" frameborder="0"></iframe>
            </div>

            <!-- Stream Info -->
            <div class="bg-gray-800 p-4 rounded-lg border border-gray-700 grid grid-cols-4 gap-4 text-center">
                <div>
                    <div class="text-xs text-gray-400">FORMAT</div>
                    <div id="info-format" class="text-lg font-bold text-blue-300">-</div>
                </div>
                <div>
                    <div class="text-xs text-gray-400">VIDEO CODEC</div>
                    <div id="info-vcodec" class="text-lg font-bold text-white">-</div>
                </div>
                <div>
                    <div class="text-xs text-gray-400">AUDIO CODEC</div>
                    <div id="info-acodec" class="text-lg font-bold text-white">-</div>
                </div>
                <div>
                    <div class="text-xs text-gray-400">SCTE-35 TRIGGER</div>
                    <div id="info-scte" class="text-lg font-bold text-gray-500">WAITING</div>
                </div>
            </div>
        </div>

        <!-- Right Panel: SCTE-35 Table -->
        <div class="w-1/2 bg-gray-800 rounded-lg border border-gray-700 flex flex-col shadow overflow-hidden">
            <div class="bg-gray-900 p-3 border-b border-gray-700 flex justify-between items-center">
                <h2 class="font-bold text-sm text-gray-300">SCTE-35 EVENT LOGS</h2>
                <button onclick="document.getElementById('log-body').innerHTML=''" class="text-xs bg-gray-700 px-2 py-1 rounded hover:bg-gray-600">Clear Logs</button>
            </div>
            <div class="flex-1 overflow-y-auto p-0">
                <table class="w-full text-left text-sm">
                    <thead class="bg-gray-700 text-gray-300 sticky top-0">
                        <tr>
                            <th class="p-3">Time</th>
                            <th class="p-3">Event ID</th>
                            <th class="p-3">Type</th>
                            <th class="p-3">Duration (s)</th>
                            <th class="p-3">Raw JSON</th>
                        </tr>
                    </thead>
                    <tbody id="log-body" class="divide-y divide-gray-700">
                        <!-- Logs inject here -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        const ws = new WebSocket(`ws://${window.location.host}/ws`);
        const btnRun = document.getElementById('btn-run');
        const btnStop = document.getElementById('btn-stop');
        const player = document.getElementById('webrtc-player');
        const placeholder = document.getElementById('player-placeholder');
        const scteIndicator = document.getElementById('info-scte');

        ws.onopen = () => document.getElementById('conn-status').classList.replace('bg-red-500', 'bg-green-500');
        ws.onclose = () => document.getElementById('conn-status').classList.replace('bg-green-500', 'bg-red-500');

        btnRun.onclick = () => {
            const url = document.getElementById('udp-url').value;
            ws.send(JSON.stringify({action: "play", url: url}));
            btnRun.classList.add('hidden');
            btnStop.classList.remove('hidden');
            document.getElementById('info-format').innerText = "Probing...";
        };

        btnStop.onclick = () => {
            ws.send(JSON.stringify({action: "stop"}));
            btnRun.classList.remove('hidden');
            btnStop.classList.add('hidden');
            player.classList.add('hidden');
            player.src = "";
            placeholder.classList.remove('hidden');
            document.getElementById('info-format').innerText = "-";
        };

        ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            
            if (msg.type === "stream_info") {
                if (msg.data.status === "ok") {
                    document.getElementById('info-format').innerText = msg.data.format;
                    document.getElementById('info-vcodec').innerText = msg.data.video_codec;
                    document.getElementById('info-acodec').innerText = msg.data.audio_codec;
                } else {
                    alert("Error: " + msg.data.msg);
                    btnStop.click();
                }
            } 
            else if (msg.type === "player_ready") {
                player.src = msg.url;
                player.classList.remove('hidden');
                placeholder.classList.add('hidden');
            }
            else if (msg.type === "scte_data") {
                // Blink indicator
                scteIndicator.innerText = "DETECTED";
                scteIndicator.classList.add('text-green-400', 'blinking');
                setTimeout(() => {
                    scteIndicator.classList.remove('text-green-400', 'blinking');
                    scteIndicator.classList.add('text-gray-500');
                    scteIndicator.innerText = "WAITING";
                }, 2000);

                // Add to table
                const data = msg.data.info || msg.data;
                const time = new Date().toLocaleTimeString();
                const eventId = data.splice_event_id || "N/A";
                const type = data.out_of_network_indicator ? "START (OUT)" : "END (IN)";
                
                // Kalkulasi durasi (ticks 90kHz = 1 detik)
                let duration = "N/A";
                if (data.break_duration) {
                    duration = (data.break_duration / 90000).toFixed(2);
                }

                const row = `<tr class="hover:bg-gray-700">
                    <td class="p-3 text-gray-400">${time}</td>
                    <td class="p-3 font-mono text-blue-300">${eventId}</td>
                    <td class="p-3 font-bold ${data.out_of_network_indicator ? 'text-red-400' : 'text-green-400'}">${type}</td>
                    <td class="p-3">${duration}</td>
                    <td class="p-3 text-xs"><button onclick='alert(${JSON.stringify(JSON.stringify(msg.data))})' class="bg-gray-600 px-2 py-1 rounded">View JSON</button></td>
                </tr>`;
                
                document.getElementById('log-body').insertAdjacentHTML('afterbegin', row);
            }
        };
    </script>
</body>
</html>
