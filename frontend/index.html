<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Simple SCTE Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col p-4 gap-4">
    <div class="flex gap-2">
        <input id="url" type="text" value="rtmp://172.16.72.23/static/SCTE" class="flex-1 bg-gray-800 border border-gray-700 px-3 py-2 rounded text-sm">
        <button id="play" class="bg-green-600 px-6 py-2 rounded font-bold text-sm">PLAY</button>
        <button id="stop" class="bg-red-600 px-6 py-2 rounded font-bold text-sm hidden">STOP</button>
    </div>

    <div class="flex-1 flex gap-4">
        <div class="w-7/12 bg-black rounded flex items-center justify-center relative overflow-hidden">
            <span id="placeholder" class="text-gray-500 font-bold">NO SIGNAL</span>
            <video id="video" controls autoplay muted class="absolute inset-0 w-full h-full hidden"></video>
        </div>
        <div class="w-5/12 bg-gray-800 p-4 rounded flex flex-col gap-2">
            <h2 class="font-bold border-b border-gray-700 pb-2">INFO</h2>
            <div>Format: <span id="f-fmt" class="text-blue-400 font-bold">-</span></div>
            <div>Video Codec: <span id="f-vcodec" class="text-green-400 font-bold">-</span></div>
            <div>Audio Codec: <span id="f-acodec" class="text-yellow-400 font-bold">-</span></div>
        </div>
    </div>

    <script>
        const ws = new WebSocket(`ws://${window.location.host}/ws`);
        const video = document.getElementById('video');
        let hls = null;

        document.getElementById('play').onclick = () => {
            ws.send(JSON.stringify({action: "play", url: document.getElementById('url').value}));
            document.getElementById('play').classList.add('hidden');
            document.getElementById('stop').classList.remove('hidden');
        };

        document.getElementById('stop').onclick = () => {
            ws.send(JSON.stringify({action: "stop"}));
            document.getElementById('play').classList.remove('hidden');
            document.getElementById('stop').classList.add('hidden');
            if(hls) hls.destroy();
            video.classList.add('hidden');
            document.getElementById('placeholder').classList.remove('hidden');
        };

        ws.onmessage = (e) => {
            const msg = JSON.parse(e.data);
            if(msg.type === "info" && msg.data.status === "ok") {
                document.getElementById('f-fmt').innerText = msg.data.format;
                document.getElementById('f-vcodec').innerText = msg.data.vcodec;
                document.getElementById('f-acodec').innerText = msg.data.acodec;
            } else if(msg.type === "ready") {
                const hlsUrl = `http://${window.location.hostname}:8888/live/index.m3u8`;
                video.classList.remove('hidden');
                document.getElementById('placeholder').classList.add('hidden');
                setTimeout(() => {
                    if (Hls.isSupported()) {
                        if(hls) hls.destroy();
                        hls = new Hls();
                        hls.loadSource(hlsUrl);
                        hls.attachMedia(video);
                        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
                    }
                }, 2000);
            }
        };
    </script>
</body>
</html>
