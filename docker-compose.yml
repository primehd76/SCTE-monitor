services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: sm_mediamtx
    network_mode: "host"
    restart: always

  backend:
    build: ./backend
    container_name: sm_backend
    network_mode: "host"
    depends_on:
      - mediamtx
    environment:
      - PYTHONUNBUFFERED=1
    restart: always
    volumes:
      - ./backend/app.py:/app/app.py:ro
      - ./frontend:/app/frontend
